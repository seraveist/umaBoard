name: Deploy GitHub Pages

on:
  workflow_run:
    workflows: ['CI']
    types: [completed]
    branches: [main]

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      github.event.workflow_run.event != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
      - name: Restore pinned portrait blobs
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: .cache/portrait-blobs
          key: portraits-v2-${{ hashFiles('data/portraits.json') }}
          restore-keys: |
            portraits-v2-
            portraits-umatools-v1-
      - name: Stage verified source and pinned portraits
        run: |
          python scripts/build_pages.py --fetch-portraits
          node scripts/check_cm_algorithm_v1.mjs --build
          jq -n --arg commit "$(git rev-parse HEAD)" --arg version "$(jq -r .active_version data/manifest.json)" '{commit:$commit,dataVersion:$version}' > .cache/pages/release.json
      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: .cache/pages

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      pages: write
      id-token: write
      contents: read
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check the tested commit is still main
        id: head
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          current=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq .object.sha)
          if [[ "$SOURCE_SHA" == "$current" ]]; then echo "current=true" >> "$GITHUB_OUTPUT"; fi
      - name: Configure GitHub Pages
        if: steps.head.outputs.current == 'true'
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6
      - name: Deploy GitHub Pages
        if: steps.head.outputs.current == 'true'
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4

      - name: Verify public release marker
        if: steps.head.outputs.current == 'true'
        env:
          SITE: ${{ steps.deployment.outputs.page_url }}
          SOURCE_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          for attempt in {1..20}; do
            if curl --fail --silent --location "${SITE%/}/release.json?v=$SOURCE_SHA" | jq -e --arg sha "$SOURCE_SHA" '.commit == $sha'; then exit 0; fi
            sleep 6
          done
          exit 1
