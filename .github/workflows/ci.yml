name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
      - name: Test source normalization and atomic activation
        run: python -m unittest discover -s tests -v
      - name: Test real JP candidates and solo comparison engine
        run: node --test tests/*.test.mjs
      - name: Validate active dataset
        run: python scripts/validate_data.py
      - name: Check browser scripts
        run: |
          for script in assets/*.mjs; do node --check "$script"; done
          node --check prototype/model.js
          node --check prototype/app.js
